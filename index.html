<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FK Spike">
<meta name="theme-color" content="#FFF7EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Familienkalender Spike</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 12px; background: #FFF7EC; color: #2D2A3E; }
  h1 { font-size: 20px; margin: 4px 0 8px; }
  h2 { font-size: 17px; margin: 18px 0 4px; }
  button, select { font: inherit; padding: 10px 12px; margin: 4px 4px 4px 0; border-radius: 10px; border: 1.5px solid #2D2A3E; background: #fff; }
  #info { font-size: 13px; background: #fff; border-radius: 10px; padding: 8px; word-break: break-word; }
  pre { background: #111; color: #9f9; padding: 8px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; max-height: 55vh; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<h1>Spike: Google Login und Kalender</h1>
<div id="info"></div>

<h2>1 · Anmeldung</h2>
<select id="scope">
  <option value="app">app.created (schmal, zuerst probieren)</option>
  <option value="app_liste">app.created + calendarlist.readonly</option>
  <option value="events_liste">events + calendarlist.readonly (BREIT, nur wenn app.created scheitert)</option>
</select><br>
<button id="login">Mit Google anmelden</button>
<button id="renew">Token erneuern (ohne Dialog?)</button>
<button id="status">Token-Status</button>

<h2>2 · Kalender</h2>
<button id="create-cals">3 TEST-Kalender anlegen</button>
<button id="list-cals">Kalender auflisten</button>
<button id="delete-cals">TEST-Kalender löschen</button>

<h2>3 · Ereignisse</h2>
<button id="ev-anw">Anwesenheit heute (ID fk…)</button>
<button id="ev-idtest">ID-Test (409, gelöscht, reaktivieren)</button>
<button id="ev-list">Ereignisse lesen (3 Kalender)</button>

<h2>4 · Push-Test</h2>
<button id="push-len">4 Termine mit Titel-Längen (in 3–6 Min)</button>
<button id="push-rem">Reminder-Test: Ereignis vs. Kalender-Standard (in 3 und 5 Min)</button>

<h2>Log</h2>
<button id="copy">Log kopieren</button>
<pre id="log"></pre>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="spike.js"></script>
</body>
</html>
